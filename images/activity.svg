<!--
  The activity-bar glyph, which is not the marketplace icon.

  Note for anyone editing this comment: a double hyphen cannot appear inside
  an XML comment. One did, the file stopped parsing, and the activity bar drew
  nothing at all. Preflight checks that now.

  VS Code requires this one to be 24x24, centred, and "a single color". It
  tints the whole thing to the active or inactive foreground, so it has to be
  monochrome, transparent, and drawn in currentColor. The marketplace icon is a
  filled, coloured, rounded square: pointed at the activity bar it renders as a
  solid block, because there is nothing for the tint to do.

  Three colours cannot survive that, but the three sections can. The logo is a
  circle cut by a vertical diameter and one radius to the upper left, so that
  is what this draws: the same two cuts, no fill anywhere. Filling a section
  was an attempt to carry the logo's weight across, and it read as two thin
  slivers beside a solid lump rather than as three parts of one circle.
-->
<svg width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"
     fill="none" stroke="currentColor" stroke-width="1.6"
     stroke-linecap="round" stroke-linejoin="round">
  <circle cx="12" cy="12" r="9"/>
  <path d="M12 3 L12 21"/>
  <path d="M12 12 L3.4 9.7"/>
</svg>
