<!--
  The activity bar icon.

  Monochrome and stroked, not the three-colour pie: VS Code recolours this to
  match the theme's foreground and an icon with its own fills would fight that,
  going invisible in one theme or the other. The same three slices, drawn as
  a circle with the two cuts that separate them.
-->
<svg width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"
     fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
  <circle cx="12" cy="12" r="8.6"/>
  <line x1="12" y1="12" x2="12" y2="3.4"/>
  <line x1="12" y1="12" x2="12" y2="20.6"/>
  <line x1="12" y1="12" x2="3.82" y2="9.34"/>
</svg>
